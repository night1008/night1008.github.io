<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Night1008">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#1e2a5e"/>
      <stop offset="0.55" stop-color="#131a3a"/>
      <stop offset="1" stop-color="#070a15"/>
    </linearGradient>
    <linearGradient id="moon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffdf0"/>
      <stop offset="1" stop-color="#ffd76e"/>
    </linearGradient>
    <clipPath id="clip">
      <rect x="0" y="0" width="64" height="64" rx="14"/>
    </clipPath>
    <mask id="crescent">
      <circle cx="29" cy="35" r="17.5" fill="#fff"/>
      <circle cx="41" cy="23.5" r="15.5" fill="#000"/>
    </mask>
  </defs>

  <g clip-path="url(#clip)">
    <rect x="0" y="0" width="64" height="64" fill="url(#sky)"/>

    <!-- stars -->
    <path d="M48 13.5 Q49.3 18.5 54.5 19.8 Q49.3 21.1 48 26.1 Q46.7 21.1 41.5 19.8 Q46.7 18.5 48 13.5 Z" fill="#fff6cf"/>
    <circle cx="14.5" cy="16.5" r="1.9" fill="#ffffff" opacity="0.9"/>
    <circle cx="54.5" cy="45" r="1.3" fill="#ffffff" opacity="0.55"/>

    <!-- crescent moon -->
    <rect x="0" y="0" width="64" height="64" fill="url(#moon)" mask="url(#crescent)"/>
  </g>
</svg>
